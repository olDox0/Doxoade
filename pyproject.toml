# pyproject.toml
[project]
name = "doxoade"
version = "580.0"
description = "olDox222 Advanced Development Environment - Chief Gold Edition"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "packaging>=23.0",
    "pathspec>=0.11.0",
    "toml>=0.10.2",
    "pyflakes>=3.1.0",
    "radon>=6.0.0",
    "jsondiff>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "cssutils>=2.9.0",
    "esprima>=4.0.1",
    "numpy>=2.0.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
legacy = ["pandas<2.3", "lxml", "pyyaml"]

[project.scripts]
doxoade = 'doxoade.__main__:main'
dox = "doxoade.__main__:main"

[tool.doxoade]
source_dir = "."
shadow_runtime = true
shadow_targets = ["doxoade"]
soteria_active = true
vulcan_turbo = true
shadow_vacuum_check = ["scan", "find", "resolve", "parse"]
keep = [ "coverage", "jsondiff", "pytest", "pyyaml", "radon", "setuptools"]

ignore = [
    # ___ PASTAS _________
    "*./experiments/",
    "*/.doxoade/",
    "*/__pycache__/",
    ".doxoade/",
    ".doxoade_cache/",
    ".git/",
    ".pytest_cache/",
    "__pycache__/",
    "build/",
    "build_soteria_test/",
    "Canone_Test/",
    "commands_test/",
    "dist/",
    "dox_lab/",
    "doxoade.egg-info/",
    "doxoade/diagnostic/",
    "doxoade/tools/benzaiten_gui/native/include/webview/",
    "doxoade/tools/benzaiten_gui/native/include/webview2/",
    "nppBackup/",
    "pytest_temp_dir/",
    "recovery_zone/",
    "regression_tests/",
    "tests/",
    "tmp/",
    "venv/",
    "Vers/",
    "w64devkit/",
    # === EXTENSÕES DE BUILD/SCRIPT ===
    "*.specpython",
    "*.bat",
    "*.sh",
    "*.xml",
    "*.pyd",
    "*.txt",
    "*.json",
    "*.jsonl",
    "*.xml",
    # === EXTENSÕES BINÁRIAS/NATIVAS ===
    "*.hh",
    "*.dll",
    "*.exe",
    # === EXTENSÕES DE BACKUP/LIXO ===
    "*.bkp",
    "*.old",
    "*.bak",
    "*.tmp",
    "*.temp",
    "*.log",
    "*.cache",
    "*.nxa",
    "*.jsonl",
    "*.conf",
    "*.ini",
    "*.whitelist_backup",
    "*.hbc5_backup",
    "*.final_backup",
    # ___ DATABASE _________
    "data/",
    "*.db-journal",
    "*.sqlite",
    "*.sqlite3",
    "*.sqlite-shm",
    "*.sqlite-wal",
    "*.sqlite-journal",
    "*.db",
    "*.db-shm",
    "*.db-wal",
    # ___ RELATÓRIOS _________
    "chief_dossier_*.xml",
    "*_dossier_*.xml",
]

exclude_categories = ["STYLE", "DOCS"]

[tool.doxoade.macrothon]
# Este carimbo transforma o Silo em uma House Viva
is_house = true
house_name = "zim_searcher"
auto_sync = true          # Ativa o Motor Uroboros
auto_promote_on_save = true # Promove Bricks modificados para o Acervo no 'doxoade save'

[tool.setuptools]
packages = ["doxoade", "doxoade.API", "doxoade.commands", "doxoade.tools", "doxoade.probes", "doxoade.diagnostic"]

[tool.pytest.ini_options]
addopts = "-v"
filterwarnings = [ "ignore::DeprecationWarning",]
norecursedirs = "Vers doxoade.egg-info .pytest_cache pytest_temp_dir tmp regression_tests"

[tool.doxoade.vulcan-ignore]
patterns = [
    "tests/",
    "docs/",
    "examples/",
    "old/",
    "**/test_*.py",
    "**/*_test.py",
    "setup.py",
    "conftest.py"
]